apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-generator
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-generator
  template:
    metadata:
      labels:
        app: log-generator
    spec:
      containers:
        - name: log-generator
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                echo "$(date) INFO application is working"
                sleep 5
              done
