apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: application-alerts
  namespace: observability
  labels:
    release: monitoring
spec:
  groups:
    - name: application.rules
      rules:
        - alert: HighErrorRate
          expr: |
            (
              sum(rate(http_requests_total{status_code=~"5.."}[5m]))
              /
              sum(rate(http_requests_total[5m]))
            ) * 100 > 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High HTTP error rate"
            description: "HTTP 5xx error rate is above 2% for 5 minutes."

        - alert: HighCPUUsage
          expr: |
            (
              sum(rate(process_cpu_seconds_total[5m])) * 100 > 75
            )
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High CPU usage"

        - alert: HighMemoryUsage
          expr: |
            (
              sum(container_memory_working_set_bytes) / 1024 / 1024 > 4 * 1024 * 1024 * 1024
            )
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High memory usage"

        - alert: HighP95Latency
          expr: |
            (
              histogram_quantile(
                0.95,
                sum by (le) (
                  rate(http_request_duration_seconds_bucket[5m])
                )
              ) > 1
            )
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High P95 latency"
